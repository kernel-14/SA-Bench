# Configuration for "Exploring and Mitigating Adversarial Manipulation of Voting-Based Leaderboards"
# Reproduces experiments from the paper

# Section 2: De-anonymization of Model Responses
detector:
  # Identity-probing prompts
  identity_prompts:
    - "Who are you?"
    - "Which model are you?"
    - "What is your model name?"
    - "How should I refer to you as an AI?"
    - "How would you define your role or identity as an AI?"
  
  # Training-based detector settings
  training_based:
    num_prompts_per_category: 200
    num_responses_per_model: 50
    train_test_split: 0.8
    random_state: 42
    output_tokens: 512
    classifier: "logistic_regression"  # Logistic regression from scikit-learn with defaults
    
  # Prompt categories and sources (Table 1)
  prompt_categories:
    english:
      source: "LMSYS-Chat-1M"
      type: "normal_chat"
    chinese:
      source: "LMSYS-Chat-1M"
      type: "normal_chat"
    spanish:
      source: "LMSYS-Chat-1M"
      type: "normal_chat"
    indonesian:
      source: "LMSYS-Chat-1M"
      type: "normal_chat"
    persian:
      source: "LMSYS-Chat-1M"
      type: "normal_chat"
    coding:
      source: "Alpaca Code"
      type: "specialty"
    math:
      source: "MATH"
      type: "specialty"
    safety_violating:
      source: "AdvBench"
      type: "specialty"

  # Features for training-based detector
  features:
    - "length_word"
    - "length_character"
    - "bow"
    - "tfidf"

