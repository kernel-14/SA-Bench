## config.yaml

# Default configuration for masked diffusion experiments.
# Task‑specific overrides are given in separate sections.

defaults:
  # General
  seed: 42
  device: "cuda"
  dtype: "float32"
  use_wandb: false
  wandb_project: "mdm_reproduction"

  # Model architecture (Transformer‑based denoiser)
  model:
    vocab_size: 50257          # GPT‑2 tokenizer size; overridden for synthetic tasks
    max_seq_length: 2048       # max token length (padded)
    hidden_size: 768           # base hidden dimension
    num_layers: 12             # number of transformer layers
    num_attention_heads: 12    # heads per layer
    intermediate_size: 3072    # 4 * hidden_size
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    positional_embedding_type: "learned"   # "learned" or "rope"

  # Diffusion parameters
  diffusion:
    schedule: "cosine"         # alpha(t) = cos(pi*t/2)
    mask_token_id: 0
    inference_steps: 50        # number of reverse diffusion steps
    adaptive_sampler: "top_margin"  # "vanilla", "top_prob", "top_margin"
    gumbel_noise_coeff: 0.5    # noise coefficient for top‑K selection (0 = off)
    sampling_temperature: 1.0  # temperature for categorical sampling

  # Training
  training:
    optimizer: "adamw"
    adam_beta1: 0.9
    adam_beta2: 0.95
    weight_decay: 0.1
    learning_rate: 4.0e-4
    min_learning_rate: 4.0e-5
    lr_schedule: "cosine"      # cosine decay
    warmup_steps: 2000
    batch_size: 8              # per‑device batch size
    gradient_accumulation_steps: 4
    num_iterations: 200_000    # training steps (IsoFLOP uses variable steps)
    log_interval: 100
    eval_interval: 2000
    save_interval: 2000
    checkpoint_dir: "./checkpoints"

  # Data
  data:
    tokenizer_name: "gpt2"     # for text tasks
    text_data_path: "./data/slimpajama"   # path to Slimpajama or subset
    nae_sat:
      N: 20
      P: 280
      vocab_size: 3            # {0,1,2}
    sudoku:
      vocab_size: 10           # 0‑9, 0 = mask
      train_file: "./data/sudoku_train.txt"
      test_file: "./data/sudoku_test.txt"
      hard_test_file: "./data/sudoku_hard_test.txt"
    zebra:
      vocab_size: ???          # depends on tokenization; set in experiment
      train_file: "./data/zebra_train.txt"
      test_file: "./data/zebra_test.txt"

  # Evaluation
  evaluation:
    # For generative perplexity
    llm_model_name: "meta-llama/Llama-2-7b-hf"
    llm_device: "cuda"
    text_sampling:
      noise_std: 0.1           # σ for additive Gaussian noise in top‑margin oracle
      num_samples: 1000

# -----------------------------------------------------------------
# Task‑specific overrides (used to override defaults when running an experiment)

π_learner_scaling:
  model:
    hidden_size: 768           # will be varied in IsoFLOP sweep
    num_layers: 12
    positional_embedding_type: "learned"
  data:
    perm_type: "uniform"       # "identity", "uniform", "closer", "much_closer"
  training:
    batch_size: 16
    gradient_accumulation_steps: 2
    learning_rate: 4.0e-4
    num_iterations: ??         # determined by FLOP budget

nae_sat_experiment:
  model:
    vocab_size: 3
    hidden_size: 768
    num_layers: 6              # ~19M param model
    num_attention_heads: 8
    max_seq_length: 512
  data:
    nae_sat:
      N: 25
      P: 275
  training:
    batch_size: 128
    learning_rate: 4.0e-4
    num_iterations: 2000       # initial training; later extended to 50000 for proxy
    lr_schedule: "cosine"
  diffusion:
    inference_steps: 50
    adaptive_sampler: "top_margin"
    gumbel_noise_coeff: 0.5

logic_puzzle_sudoku:
  model:
    vocab_size: 10
    hidden_size: 384
    num_layers: 6
    num_attention_heads: 6
    max_seq_length: 81
  training:
    batch_size: 128
    learning_rate: 1.0e-3
    num_iterations: null       # we use epochs instead
    epochs: 300                # 300 epochs
  diffusion:
    inference_steps: 50
    adaptive_sampler: "top_margin"
    gumbel_noise_coeff: 0.5

logic_puzzle_zebra:
  model:
    hidden_size: 768
    num_layers: 12
    num_attention_heads: 12
  training:
    batch_size: 128
    learning_rate: 1.0e-3
    epochs: 300                # assumed similar
  diffusion:
    inference_steps: 50
    adaptive_sampler: "top_margin"
    gumbel_noise_coeff: 0.5

llada_8b_inference:
  model:
    use_pretrained: true
    pretrained_model_name: "llada-8b"   # placeholder; may fall back to a smaller MDM
  diffusion:
    inference_steps: 100       # LLaDA often uses 1000? The paper does not specify; we use a reasonable 100
    adaptive_sampler: "top_margin"
    sampling_temperature: 0.8
  evaluation:
    tasks:
      - "humaneval_single"
      - "humaneval_multi"
      - "humaneval_split"
      - "math_gsm8k"
      - "mmlu"
      - "rocstories"