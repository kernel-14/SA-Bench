## Code: config.yaml
# PGR Configuration File

environment:
  task_name: "cheetah-run"           # DMC task or Gym id
  state_based: true                  # true for state-based, false for pixel-based
  total_env_steps: 100000            # 100k for standard tasks, 300k for finger-turn-hard
  random_seed: 0                     # Base seed, will be iterated across runs

replay_buffer:
  real_capacity: 1000000             # 1M transitions
  synthetic_capacity: 1000000        # 1M synthetic transitions
  synthetic_ratio: 0.5               # fraction of synthetic data in each policy batch
  batch_size: 256                    # policy batch size (real + synthetic)
  real_per_batch: 128                # fixed number of real samples per batch (kept constant when scaling)

policy:
  algorithm: "redq"                  # "redq" for state-based, "drqv2" for pixel-based
  utd_ratio: 20                      # number of gradient steps per environment step
  learning_rate: 3.0e-4              # actor/critic learning rate
  discount_gamma: 0.99
  polyak_tau: 0.005                  # target network update rate
  critic_ensemble_size: 5            # for REDQ
  hidden_sizes: [256, 256]           # MLP layers for Q-functions (default: 2 layers of 256)
  activation: "relu"

relevance:
  type: "curiosity"                  # one of: "reward", "return", "td_error", "curiosity"
  curiosity:
    encoder_hidden_sizes: [256, 256] # feature encoder for ICM
    forward_dynamics_hidden_sizes: [256, 256]
    learning_rate: 3.0e-4
    update_fraction: 0.05            # fraction of policy updates where ICM is trained

diffusion:
  denoising_steps: 1000              # DDPM steps
  noise_schedule: "linear"           # linear beta schedule
  batch_size: 256                    # diffusion training batch size
  learning_rate: 1.0e-4
  inner_train_steps: 5000            # number of gradient updates per inner loop retraining
  uncond_prob: 0.25                  # probability of dropping condition (for CFG)
  guidance_scale: 1.0                # ω (classifier-free guidance strength)
  condition_dim: 1                   # scalar relevance value
  prompt_ratio: 0.5                  # top fraction of real buffer used to sample conditions during generation

pgr_algorithm:
  inner_loop_frequency: 10000        # retrain diffusion every I=10k env steps
  synthetic_samples_per_loop: 1000000 # 1M transitions generated each inner loop
  eval_interval: 5000                # evaluate policy every N environment steps
  eval_episodes: 10                  # number of episodes for evaluation

logging:
  use_wandb: false
  project_name: "PGR"
  run_name: "default"
  checkpoint_dir: "checkpoints"