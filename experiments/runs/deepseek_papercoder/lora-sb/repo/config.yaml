## config.yaml
# LoRA-SB reproduction configuration
# All values extracted from the paper; annotated with (?) where ambiguous.

general:
  seed: 42
  device: cuda
  dtype: bfloat16
  init_samples_fraction: 0.001  # 0.1% of training set

# Arithmetic Reasoning (Mistral-7B, Gemma-2 9B)
arithmetic:
  model_names:
    - "mistralai/Mistral-7B-v0.1"
    - "google/gemma-2-9b"   # adjust path as needed
  dataset: "meta-math/MetaMathQA"
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  ranks: [32, 64, 96]
  training:
    lr: 0.0001
    batch_size: 1
    gradient_accumulation_steps: 32
    max_seq_length: 512
    epochs: 1
    warmup_ratio: 0.02
    dropout: 0.0
    lr_scheduler: cosine
    optimizer: adamw

# Commonsense Reasoning (Llama-3.2 3B)
commonsense:
  model_name: "meta-llama/Llama-3.2-3B"
  dataset: "commonsense170k"   # pre‑processed combined dataset
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  ranks: [32, 64, 96]
  training:
    lr: 0.002
    batch_size: 6
    gradient_accumulation_steps: 24
    max_seq_length: 256
    epochs: 2
    warmup_ratio: 0.02
    dropout: 0.05
    lr_scheduler: linear
    optimizer: adamw

# GLUE (RoBERTa-large) – original LoRA settings used with lr=1e‑3
glue:
  model_name: "FacebookAI/roberta-large"
  tasks: ["cola", "rte", "mrpc", "stsb", "qnli", "sst2"]
  target_modules: ["query", "key", "value", "output"]  # only self‑attention
  ranks: [8, 16, 24]
  training:
    lr: 0.001
    # Batch sizes per task (following Hu et al. LoRA paper)
    batch_sizes:
      cola: 32
      rte: 32
      mrpc: 16
      stsb: 16
      qnli: 32
      sst2: 32
    # Max sequence lengths (following Hu et al. LoRA paper)
    max_seq_lengths:
      cola: 128
      rte: 64
      mrpc: 128
      stsb: 128
      qnli: 128
      sst2: 128
    epochs: 30          # (?) from garbled Table 9, possibly 30 for all tasks
    warmup_ratio: 0.06
    dropout: 0.0
    lr_scheduler: linear
    optimizer: adamw