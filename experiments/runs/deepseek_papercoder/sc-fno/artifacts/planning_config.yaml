## config.yaml
# ============================================================================
# Global settings
# ============================================================================
global:
  seed: 42
  output_dir: "./outputs"
  data_dir: "./data"
  device: "cuda"   # or "cpu"

# ============================================================================
# Equation selection: must be one of the keys below
# ============================================================================
equation: "pde1"   # options: ode1, ode2, pde1, pde2, pde3, pde4, pde2_zoned

# ============================================================================
# Per‑equation definitions (discretization, parameter ranges, initial M steps)
# ============================================================================
equations:
  ode1:
    name: "Composite Harmonic Oscillator"
    temporal_domain: [0.0, 1.0]
    N_time: 100            # total time steps
    M: 10                  # initial steps provided as input
    spatial_dims: 0        # 0 = ODE
    param_ranges:
      alpha: [1.0, 3.0]
      beta:  [1.0, 3.0]
      gamma: [0.0, 1.0]
    param_names: ["alpha", "beta", "gamma"]
    initial_condition: "sin(gamma * pi)"

  ode2:
    name: "Duffing Oscillator"
    temporal_domain: [0.0, 1.0]
    N_time: 100
    M: 10
    spatial_dims: 0
    param_ranges:
      alpha: [0.02, 0.06]
      beta:  [0.01, 0.03]
      gamma: [20.0, 60.0]
      delta: [0.5, 1.5]
      omega: [0.2, 0.6]
      epsilon: [0.0, 0.2]
      zeta:   [0.0, 0.2]
    param_names: ["alpha", "beta", "gamma", "delta", "omega", "epsilon", "zeta"]

  pde1:
    name: "Generalized Nonlinear Damped Wave Equation"
    temporal_domain: [0.0, 1.0]
    spatial_domain: [0.0, 1.0]
    N_time: 30
    S_x: 20
    M: 5
    spatial_dims: 1
    param_ranges:
      c:     [0.0, 0.25]
      alpha: [0.0, 0.1]
      beta:  [0.0, 0.25]
      gamma: [0.0, 0.25]
      omega: [0.0, 0.25]
    param_names: ["c", "alpha", "beta", "gamma", "omega"]

  pde2:
    name: "Forced Burgers' Equation"
    temporal_domain: [0.0, 3.14159265359]   # [0, pi]
    spatial_domain: [0.0, 1.0]
    N_time: 30
    S_x: 40
    M: 5
    spatial_dims: 1
    param_ranges:
      alpha: [0.1, 1.0]
      gamma: [0.025, 0.25]
      delta: [0.1, 0.5]
      omega: [0.01, 0.1]
    param_names: ["alpha", "gamma", "delta", "omega"]

  pde2_zoned:
    name: "Zoned Forced Burgers' Equation"
    temporal_domain: [0.0, 3.14159265359]
    spatial_domain: [0.0, 1.0]
    N_time: 30
    S_x: 40
    num_zones: 40
    M: 5
    spatial_dims: 1
    # Each zone has independent alpha and delta; global gamma and omega
    param_ranges:
      alpha_zonal: [0.1, 1.0]        # per zone
      delta_zonal: [0.1, 0.5]        # per zone
      gamma:       [0.025, 0.25]
      omega:       [0.01, 0.1]
    param_names: []   # built dynamically (82 params)
    total_params: 82

  pde3:
    name: "Navier-Stokes (Vorticity-Stream Function)"
    temporal_domain: [0.0, 3.0]
    spatial_domain: [0.0, 1.0, 0.0, 1.0]
    N_time: 1             # only initial condition -> final time
    S_x: 64
    S_y: 64
    M: 1
    spatial_dims: 2
    param_ranges:
      alpha: [3.14159265359, 15.7079632679]   # [pi, 5*pi]
      beta:  [3.14159265359, 15.7079632679]
    param_names: ["alpha", "beta"]
    Re: 1000

  pde4:
    name: "Allen-Cahn Equation"
    temporal_domain: [0.0, 1.0]
    spatial_domain: [0.0, 1.0]
    N_time: 30
    S_x: 40
    M: 5
    spatial_dims: 1
    param_ranges:
      c:     [0.1, 0.9]
      alpha: [0.01, 1.0]
      beta:  [0.01, 1.0]
      omega: [5.0, 10.0]
      epsilon: [0.01, 1.0]
    param_names: ["c", "alpha", "beta", "omega", "epsilon"]

# ============================================================================
# Data generation
# ============================================================================
data:
  num_samples: 2000        # total samples to generate (pde3 uses 1000, pde4 uses 500)
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  gradient_method: "AD"    # "AD" (auto‑diff) or "FD" (finite differences)
  fd_epsilon: 0.0001       # finite‑difference step for FD method
  solver: "dopri5"         # torchdiffeq solver method
  rtol: 1.0e-5
  atol: 1.0e-7
  perturbed_test: false    # whether to create extrapolated parameter test set
  perturbation_lambda: 0.4 # λ for parameter extrapolation tests

# ============================================================================
# Model architecture (Table C.7)
# ============================================================================
model:
  modes:
    t: 8        # Fourier modes along time (set to 0 for pde3)
    x: 8        # Fourier modes along x
    y: 8        # Fourier modes along y (only used for 2D spatial + time)
  width: 20
  n_layers: 4            # number of Fourier layers
  activation: "gelu"     # commonly used in FNO papers
  param_embedding_hidden: 32   # hidden dim of parameter MLP

# ============================================================================
# Training hyperparameters (Tables C.7 and C.8)
# ============================================================================
training:
  learning_rate: 0.001
  epochs: 500
  batch_size:
    ode: 16
    pde1: 4
    pde2: 4
    pde2_zoned: 1
    pde3: 4
    pde4: 1
  optimizer: "adam"
  scheduler: null              # none by default
  # Loss function selection and weights (Algorithm 1–3)
  loss:
    variant: "sc_fno"           # one of: fno, fno_pinn, sc_fno, sc_fno_pinn
    c1_data: 1.0                # weight of L_u
    c2_sensitivity: 1.0         # weight of L_s (only for sc_fno, sc_fno_pinn)
    c3_eq: 1.0                  # weight of L_eq (only for pinn variants)
    sensitivity_n_points: 200   # number of random spatio‑temporal points for L_s
  # PINN parameters (only used when variant includes pinn)
  pinn:
    alpha: 0.1                  # weighting factor for IC/BC losses
    n_interior: 1000            # collocation points inside domain
    n_ic: 100
    n_bc: 100

# ============================================================================
# Partial‑training data experiments (Section 3.3, Figure 4)
# ============================================================================
data_volume:
  enabled: false
  training_sizes: [100, 250, 500, 1000, 2000]

# ============================================================================
# Evaluation
# ============================================================================
evaluation:
  metrics: ["r2", "relative_l2"]
  save_plots: true
  plot_format: "pdf"

# ============================================================================
# Parameter inversion (Section 3.1)
# ============================================================================
inversion:
  enabled: false
  method: "gradient_descent"    # AD‑based optimisation on surrogate
  optimizer: "adam"
  lr: 0.01
  steps: 500
  single_param: "alpha"         # parameter to invert in single‑param mode
  multi_param: true            # if true, invert all parameters simultaneously
  num_experiments: 20           # number of random test samples for inversion