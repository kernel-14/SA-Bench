      n: 5

  # --- APPS Code Generation ---
  apps_2b:
    model_name: "google/codegemma-1.1-2b"
    dataset_name: "apps"
    max_prompt_length: 600
    max_response_length: 512
    # No RM stage; reward from compiler feedback (see ppo)
    sft:
      batch_size: 16
      epochs: 1
      learning_rate: 5.0e-6
      lr_scheduler: "cosine"
      warmup_ratio: 0.0
    rm: null
    ppo:
      batch_size: 16
      policy_learning_rate: 5.0e-7
      critic_learning_rate: 5.0e-5
      epochs_over_dataset: 1
      ppo_epochs: 1
      rollout_batch_size: 1
      clip_ratio: 0.2
      lambda_gae: 0.95
      gamma_gae: 1.0
      kl_coef: 0.05
      warmup_steps: 20
      temperature: 1.0
      top_p: 1.0
      top_k: 5
      reward_type: "compiler"    # Appendix B.5
    macro:
      enabled: true
      termination: "fixed_ngram"
      n: 5

  apps_7b:
    model_name: "google/codegemma-1.1-7b-it"
    dataset_name: "apps"
    max_prompt_length: 600
    max_response_length: 512
