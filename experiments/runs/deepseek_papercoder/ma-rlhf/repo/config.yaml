      batch_size: 32
      epochs: 1
      learning_rate: 2.0e-6
      lr_scheduler: "cosine"
      warmup_ratio: 0.0
    rm: null
    ppo:
      batch_size: 16
      policy_learning_rate: 5.0e-7
      critic_learning_rate: 5.0e-5
      epochs_over_dataset: 1
