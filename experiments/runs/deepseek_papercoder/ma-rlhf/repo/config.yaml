      batch_size: 256
      policy_learning_rate: 1.0e-6
      critic_learning_rate: 1.0e-6
      epochs_over_dataset: 4
      ppo_epochs: 1
      rollout_batch_size: 1
      clip_ratio: 0.2
      lambda_gae: 0.95
      gamma_gae: 1.0
