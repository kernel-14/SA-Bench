  gym_locomotion:
    tasks: ["Ant-v4", "HalfCheetah-v4", "Hopper-v4", "Humanoid-v4", "Walker2d-v4"]
    total_timesteps: 1_000_000
    action_repeat: 1
    eval_frequency: 5000               # every 5k steps
    normalization: "TD3"
    # Normalization reference scores (from paper appendix)
    random_scores:
      Ant-v4: -70.288
