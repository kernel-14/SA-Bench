## config.yaml

# Common hyperparameters (fixed across all benchmarks)
common:
  discount_factor: 0.99
  replay_buffer_capacity: 1_000_000
  batch_size: 256
  target_update_frequency: 250        # T_target (steps)
  replay_ratio: 1                     # updates per environment step
  optimizer:
    type: "AdamW"
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
  hidden_dim: 512
  zs_dim: 512
  zsa_dim: 512
  za_dim: 256
  activation_hidden: "ELU"            # hidden layers in encoder & value
  activation_policy: "ReLU"           # policy hidden layers
  weight_init: "xavier_uniform"
  bias_init: 0.0
  reward_bins: 65
  reward_range: [-10, 10]             # linear spacing for symexp bins
  exploration_noise_std: 0.2          # sigma
  exploration_noise_clip: 0.3         # c (for continuous)
  initial_random_steps: 10000         # warmup exploration
  gradient_clip_norm: 20              # policy gradients only

# Encoder specific
encoder:
  learning_rate: 3.0e-4
  dynamics_loss_weight: 0.1
  reward_loss_weight: 0.1
  terminal_loss_weight: 0.1           # activated after first terminal seen
  horizon: 5                          # H_Enc (unroll length)
  # Reward prediction uses two-hot categorical cross-entropy
  # Losses summed over horizon steps

# Value function specific
value:
  learning_rate: 3.0e-4
  multi_step_horizon: 3               # H_Q (n-step returns)
  target_policy_noise: 0.2            # sigma
  target_policy_noise_clip: 0.3       # c
  min_clip_double: true               # use min over two Q-targets
  huber_delta: 1.0

# Policy network specific
policy:
  learning_rate: 3.0e-4
  pre_activ_loss_weight: 1.0e-5       # lambda_pre-activ
  gumbel_softmax_tau: 10.0

# LAP (Prioritized replay) specific
lap:
  alpha: 0.4                          # smoothing for priority
  min_priority: 1.0

# Target network & reward scaling
target:
  update_frequency: 250               # same as target_update_frequency for clarity
  reward_scaling: "running_mean_buffer"  # computed from absolute rewards, updated each target copy

# Evaluation settings
evaluation:
  num_episodes: 10
  # Evaluation frequencies are benchmark-specific

# Benchmark-specific settings
