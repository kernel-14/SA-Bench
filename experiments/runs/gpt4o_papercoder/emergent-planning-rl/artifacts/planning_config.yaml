## config.yaml
training:
  learning_rate: 4e-4
  batch_size: 16
  epochs: 250
  discount_rate: 0.97
  lambda_vtrace: 0.97
  entropy_penalty: 0.01
  weight_decay: 1e-5
  l2_penalty: 1e-3

agent:
  architecture: DRCModel
  recurrent_ticks: 3
  convlstm_layers: 3
  convlstm_channels: 32
  kernel_size: 3
  padding: 1

environment:
  grid_size: 8
  max_steps: 120
  rewards:
    step_penalty: -0.01
    target_reward: 1
    box_off_target_penalty: -1
    solve_level_reward: 10

dataset:
  dataset_path: "./data/boxoban"
  training_levels: 900000
  validation_levels: 1000
  input_representation: "symbolic"
  format: "8x8x7"