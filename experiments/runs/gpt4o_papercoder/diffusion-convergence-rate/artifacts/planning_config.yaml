## config.yaml
training:
  learning_rate: 0.001  # Placeholder; paper does not specify exact learning rate—adjust as needed
  batch_size: 64  # Not specified in the paper, typical for image-based tasks
  epochs: 100  # Placeholder since paper doesn't specify
  gradient_clip: 1.0  # Use for stability, paper doesn’t specify

model:
  score_function:
    pretrained: false  # Option to load pretrained weights
  layers: 3  # Specify the number of layers if needed
  hidden_units: 128  # No size given; choose a reasonable default

sampling:
  T: 1000  # Number of diffusion steps
  K: 10  # Number of rounds for discretization
  Lipschitz_constant: 0.01
  step_schedule:
    randomized: true
    c0: 0.001
    c1: 0.01

dataset:
  type: "Gaussian"  # Synthetic Gaussian distribution
  dimensions: 10  # Placeholder dataset dimensions
  training_samples: 10000
  testing_samples: 2000

evaluation:
  metrics:
    - total_variation
    - kl_divergence

output:
  directory: "results/"
  save_checkpoints: true
  save_plots: true