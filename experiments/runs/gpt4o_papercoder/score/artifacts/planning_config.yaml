## config.yaml
training:
  stage1:
    learning_rate: 5e-6
    batch_size: 512
    steps: 3000
    optimizer: Adam
    sampling_temperature: 1.0
    kl_penalty: 0.1  # Regularization strength for first-turn responses
  stage2:
    learning_rate: 1e-5
    batch_size: 128
    steps: 1500
    optimizer: Adam
    sampling_temperature: 1.0
    kl_penalty: 0.01  # Regularization strength for second-turn responses
    reward_shaping_alpha: 10  # Encouraging progress between turns
datasets:
  math:
    train_path: "path_to_math_train_split"
    test_path: "path_to_math_test_split"
    num_train_problems: 4500
    num_test_problems: 500
  humaneval:
    train_path: "path_to_mbpp_train_split"
    test_path: "path_to_humaneval_test_split"
models:
  base_model: "Gemini 1.0 Pro"  # For coding tasks
  reasoning_model: "Gemini 1.5 Flash"  # For math tasks
evaluation:
  metrics:
    accuracy_t1: "Accuracy on first attempt"
    accuracy_t2: "Accuracy on second attempt"
    delta_metrics:
      delta_t1_t2: "Improvement between turns"
      incorrect_to_correct: "Fraction of incorrect first-turn responses corrected"
      correct_to_incorrect: "Fraction of correct first-turn responses degraded"
logging:
  log_path: "logs/training_logs.txt"
  seed: 42
hardware:
  gpu_memory_requirements: "Large > 16 GB recommended"
  num_gpus: 2