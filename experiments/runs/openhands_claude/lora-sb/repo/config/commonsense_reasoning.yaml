# Commonsense Reasoning: Llama-3.2 3B on COMMONSENSE170K
# Evaluated on 8 commonsense reasoning datasets
# Paper Table 2

model_name: "meta-llama/Llama-3.2-3B"
task: "commonsense"

# Dataset
train_dataset: "MuskumPillerum/commonsense_170k"
eval_datasets:
  - "boolq"
  - "piqa"
  - "social_i_qa"
  - "hellaswag"
  - "winogrande"
  - "ARC-Easy"
  - "ARC-Challenge"
  - "openbookqa"
max_seq_len: 256

# LoRA configuration
# Applied to: q, k, v, o, and all FC weight matrices
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Rank options from paper: 32, 64, 96
rank: 96
alpha: 96

# Method: "lora_sb", "lora_xs", "lora", "rslora", "pissa", "dora", "lora_pro"
method: "lora_sb"

# LoRA-SB initialization
# 0.1% of COMMONSENSE170K ≈ 170 samples
init_n_samples: 170
init_batch_size: 1

# Training hyperparameters (Table 8)
optimizer: "adamw"
learning_rate: 2.0e-3
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
batch_size: 6
gradient_accumulation_steps: 24
num_epochs: 2
dropout: 0.05
max_grad_norm: 1.0
lr_scheduler: "linear"
warmup_ratio: 0.02

# Logging
logging_steps: 10
save_steps: 500
output_dir: "outputs/commonsense_llama3b"

# Misc
seed: 42
dtype: "bfloat16"
device: "cuda"
