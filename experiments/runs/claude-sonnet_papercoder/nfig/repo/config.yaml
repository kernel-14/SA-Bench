## config.yaml

## FR-VAE (Image Tokenizer) Configuration
frvae:
  ## Encoder settings
  encoder_model: "vit_base_patch14_dinov2"   # DINOv2-base pretrained backbone
  pretrained_encoder: true
  image_size: 256
  latent_spatial_size: 16                    # H' = W' = 16 (feature map spatial resolution)
  latent_channels: 768                       # DINOv2-base output channel dimension

  ## Residual Quantizer settings
  codebook_size: 4096                        # K: number of codebook entries (from paper Section 4.1)
  codebook_dim: 768                          # C: codebook vector dimension, matches latent_channels

  ## Frequency band scale factors (from paper Section 4.1)
  ## Produces token counts: 1+4+9+16+25+36+64+100+169+256 = 680 total tokens
  scale_factors: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16]
  total_tokens: 680                          # Sum of h_i * w_i across all scales (from paper Section 4.1)
  num_frequency_bands: 10                    # n: number of frequency bands

  ## Loss weights (from paper Appendix B.1)
  ## L = ||I - I_hat||^2 + ||f_hat - f_hat_reconstructed||^2 + L_p(I) + 0.5 * L_g(I)
  gan_loss_weight: 0.5                       # Weight for GAN adversarial loss (explicitly stated in paper)
  lpips_weight: 1.0                          # Weight for LPIPS perceptual loss
  reconstruction_weight: 1.0                 # Weight for pixel-space L2 reconstruction loss
  freq_quantization_weight: 1.0             # Weight for frequency-guided quantization loss
  commitment_loss_weight: 0.25              # Standard VQ commitment loss beta

  ## Discriminator
  use_dino_discriminator: true              # DINO discriminator from VAR tokenizer (from paper Section 4.1)

  ## Training hyperparameters
  ## Note: FR-VAE-specific lr/epochs not stated in paper; using VQ-GAN defaults
  learning_rate: 1.0e-4                     # Generator learning rate (not specified, VQ-GAN default)
  disc_learning_rate: 1.0e-4               # Discriminator learning rate (not specified, VQ-GAN default)
  batch_size: 8                             # Per-GPU batch size for tokenizer training (not specified)
  epochs: 100                               # FR-VAE training epochs (not specified in paper)
  warmup_steps: 1000
  grad_clip: 1.0

  ## Target reconstruction FID (from paper Section 1 and Table 2)
  target_rfid: 0.85


## NFIG Transformer Configuration
nfig:
  ## Model architecture (from paper Section 4.1)
  ## "VAR Transformer backbone with a depth of 16"
  depth: 16                                 # Number of transformer blocks (from paper Section 4.1)
  ## 310M parameter model; inferred dimensions consistent with VAR-d16
  hidden_dim: 1024
  num_heads: 16
  ffn_ratio: 4                              # Feed-forward expansion ratio
  dropout: 0.0

  ## Vocabulary and sequence settings (from paper Section 4.1)
  codebook_size: 4096                       # K: shared with FR-VAE codebook
  scale_factors: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16]
  total_tokens: 680                         # Total token sequence length
  num_frequency_bands: 10                   # Number of autoregressive generation steps

  ## Class conditioning
  num_classes: 1000                         # ImageNet 1k classes
  null_class_id: 1000                       # Extra null class index for CFG unconditional training

  ## CFG training dropout (not specified in paper; standard practice)
  cfg_dropout_prob: 0.1                     # Probability of replacing class label with null class

  ## Training hyperparameters (from paper Section 4.1)
  ## "Adam optimizer, learning rate 8e-5, batch size 768, 350 epochs"
  learning_rate: 8.0e-5                     # Explicitly stated in paper Section 4.1
  batch_size: 768                           # Explicitly stated in paper Section 4.1
  epochs: 350                               # Explicitly stated in paper Section 4.1
  warmup_steps: 5000
  grad_clip: 1.0
  weight_decay: 0.0

  ## Inference settings (from paper Section 4.1)
  ## "CFG to 4.5 and top_k to 990"
  cfg_scale: 4.5                            # Classifier-Free Guidance scale (from paper Section 4.1)
  top_k: 990                                # Top-k sampling parameter (from paper Section 4.1)

  ## Generation steps equals number of frequency bands
  num_generation_steps: 10                  # One step per frequency band (from paper Table 2 #Step=10)

  ## Target generation FID (from paper Table 2)
  target_gfid: 2.81


## Dataset Configuration
data:
  ## ImageNet ILSVRC 2012 (from paper Section 4.1)
  dataset: "imagenet"
  train_dir: "data/imagenet/train"
  val_dir: "data/imagenet/val"

  ## Image resolution (from paper Table 2: ImageNet 256x256)
  image_size: 256

  ## DataLoader settings
  num_workers: 8
  pin_memory: true

  ## Preprocessing: standard ImageNet normalization to [-1, 1]
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

  ## Augmentation (standard for ImageNet generation benchmarks)
  random_horizontal_flip: true
  center_crop: true


## Training Infrastructure Configuration
training:
  ## Hardware (from paper Section 4.1: "NVIDIA H100 graphics cards")
  device: "cuda"
  hardware: "H100"

  ## Distributed training
  distributed: true
  backend: "nccl"

  ## Mixed precision (standard practice for H100 training)
  mixed_precision: true
  precision: "bf16"                         # bf16 preferred on H100

  ## Checkpointing
  checkpoint_dir: "checkpoints"
  save_every_epochs: 10
  keep_last_n_checkpoints: 5

  ## Logging
  log_dir: "logs"
  log_every_steps: 100
  tensorboard: true

  ## Evaluation frequency
  eval_every_epochs: 10
  num_eval_samples: 50000                   # Standard for FID computation on ImageNet


## Evaluation Configuration
evaluation:
  ## Metrics (from paper Section 4.1)
  ## FID, IS, Precision, Recall
  metrics: ["gfid", "rfid", "is", "precision", "recall"]

  ## Number of generated samples for FID/IS computation
  num_samples: 50000

  ## Inference settings (from paper Section 4.1)
  cfg_scale: 4.5
  top_k: 990

  ## Output directory for generated samples
  output_dir: "generated_samples"

  ## FID reference statistics
  ## Computed from ImageNet validation set (50k images)
  fid_reference: "data/imagenet_val_fid_stats.npz"


## Ablation Study Configuration (from paper Table 5)
## Tracks incremental component additions
ablation:
  ## Baseline: standard AR with 256 tokens (rFID=1.62, gFID=18.65)
  baseline_sequence_length: 256

  ## Step 2: + FR-Quantizer (rFID=1.40)
  ## Step 3: + DINO-Disc (rFID=0.85)
  ## Step 4: + AdaLN transformer (gFID=9.7)
  ## Step 5: + Top_k (gFID=6.83)
  ## Step 6: + CFG (gFID=2.81)
  stages:
    - name: "baseline_ar"
      sequence_length: 256
      use_fr_quantizer: false
      use_dino_disc: false
      use_cfg: false
      use_topk: false
    - name: "fr_quantizer"
      sequence_length: 680
      use_fr_quantizer: true
      use_dino_disc: false
      use_cfg: false
      use_topk: false
    - name: "dino_disc"
      sequence_length: 680
      use_fr_quantizer: true
      use_dino_disc: true
      use_cfg: false
      use_topk: false
    - name: "adaLN"
      sequence_length: 680
      use_fr_quantizer: true
      use_dino_disc: true
      use_cfg: false
      use_topk: false
    - name: "topk"
      sequence_length: 680
      use_fr_quantizer: true
      use_dino_disc: true
      use_cfg: false
      use_topk: true
    - name: "cfg"
      sequence_length: 680
      use_fr_quantizer: true
      use_dino_disc: true
      use_cfg: true
      use_topk: true


## Scaling Study Configuration (from paper Table 3)
scaling:
  ## Both models trained for 55 epochs under computational constraints
  short_run_epochs: 55

  models:
    - name: "NFIG-310M"
      depth: 16
      hidden_dim: 1024
      num_heads: 16
      target_fid: 5.47                      # From paper Table 3
      target_is: 224.20

    - name: "NFIG-600M"
      depth: 20
      hidden_dim: 1280
      num_heads: 16
      target_fid: 5.07                      # From paper Table 3
      target_is: 225.16