## Experiment settings
experiment:
  seeds: 10                       # 10 seeds for main results
  ablation_seeds: 5               # 5 seeds for design study
  save_dir: results
  log_interval: 1000              # log training metrics every 1k steps

## Ablation study variants (Section 5.2)
## Each variant name maps to a config override
ablations:
  none:
    description: "Full MR.Q (default)"
  linear_value:
    description: "Replace non-linear value function with linear z_sa^T w"
    value_linear: true
  dynamics_target:
    description: "Use state-action embedding z_{s'a'} as dynamics target instead of z_{s'}"
    use_sa_dynamics_target: true
  no_target_encoder:
    description: "Use current encoder for dynamics target, no stop-gradient"
    use_target_encoder: false
  revert:
    description: "All three relaxations simultaneously (linear value + sa dynamics target + no target encoder)"
    value_linear: true
    use_sa_dynamics_target: true
    use_target_encoder: false
  nonlinear_model:
    description: "Replace linear MDP predictor with separate non-linear MLPs"
    nonlinear_model: true
  mse_reward:
    description: "Replace categorical cross-entropy reward loss with MSE"
    use_mse_reward: true
  no_reward_scaling:
    description: "Remove reward scaling, set r_bar = r_bar_prime = 1"
    use_reward_scaling: false
  no_min:
    description: "Take mean over target Q-networks instead of minimum"
    use_min_q: false
  no_lap:
    description: "Remove LAP prioritized sampling, use uniform + MSE value loss"
    use_lap: false
  no_mr:
    description: "Remove model-based representation learning, train encoder end-to-end with value"
    use_encoder_loss: false
  one_step_return:
    description: "Remove multi-step returns, use 1-step TD (H_Q=1)"
    multi_step_horizon: 1
  no_unroll:
    description: "Remove dynamics unrolling in encoder loss (H_Enc=1)"
    enc_horizon: 1