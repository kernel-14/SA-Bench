## config.yaml
## MR.Q Configuration - All hyperparameters fixed across all benchmarks
## as specified in Table 3 of the paper (Appendix B.1)

## Encoder network hyperparameters
encoder:
  dynamics_loss_weight: 1.0       # lambda_Dynamics (base weight, implied)
  reward_loss_weight: 0.1         # lambda_Reward
  terminal_loss_weight: 0.1       # lambda_Terminal (0 until first terminal seen)
  horizon: 5                      # H_Enc: unroll horizon for encoder loss
  optimizer: adamw                # AdamW (Loshchilov & Hutter, 2019)
  learning_rate: 1.0e-4           # 1e-4
  weight_decay: 1.0e-4            # 1e-4
  zs_dim: 512                     # state embedding dimension
  zsa_dim: 512                    # state-action embedding dimension
  za_dim: 256                     # action embedding dimension (internal only)
  hidden_dim: 512                 # hidden layer dimension
  activation: elu                 # ELU (Clevert et al., 2015)
  weight_init: xavier_uniform     # Xavier uniform (Glorot & Bengio, 2010)
  bias_init: 0.0                  # all biases initialized to 0
  reward_bins: 65                 # number of bins for categorical reward
  reward_range_low: -10.0         # symlog-space lower bound (effective ~-22k)
  reward_range_high: 10.0         # symlog-space upper bound (effective ~+22k)

## Value network hyperparameters
value:
  optimizer: adamw
  learning_rate: 3.0e-4           # 3e-4
  hidden_dim: 512
  activation: elu
  weight_init: xavier_uniform
  bias_init: 0.0
  gradient_clip_norm: 20.0        # gradient clipping norm for value network

## Policy network hyperparameters
policy:
  pre_activation_loss_weight: 1.0e-5   # lambda_pre-activ
  optimizer: adamw
  learning_rate: 3.0e-4           # 3e-4
  hidden_dim: 512
  activation: relu                # ReLU for policy (differs from encoder/value)
  weight_init: xavier_uniform
  bias_init: 0.0
  gumbel_softmax_tau: 10.0        # Gumbel-Softmax temperature for discrete actions

## TD3-style value learning hyperparameters
td3:
  multi_step_horizon: 3           # H_Q: multi-step return horizon
  target_policy_noise_std: 0.2    # sigma for target policy smoothing noise
  target_policy_noise_clip: 0.3   # c: clipping bound for target policy noise

## LAP (Loss-Adjusted Prioritized) replay hyperparameters
lap:
  priority_alpha: 0.4             # probability smoothing alpha
  min_priority: 1.0               # minimum priority to avoid zero probability

## Exploration hyperparameters
exploration:
  initial_random_steps: 10000     # 10k random steps before learning starts
  noise_std: 0.2                  # Gaussian exploration noise std

## Common / shared hyperparameters
common:
  discount: 0.99                  # gamma: discount factor
  replay_buffer_capacity: 1000000 # 1M transitions
  batch_size: 256                 # minibatch size
  target_update_freq: 250         # T_target: steps between target network syncs
  replay_ratio: 1                 # gradient updates per environment step (assumed)

## Benchmark-specific settings
## These override common settings per benchmark
benchmarks:
  gym:
    total_steps: 1000000          # 1M time steps
    eval_freq: 5000               # evaluate every 5k steps
    eval_episodes: 10
    action_repeat: 1              # no action repeat
    frame_stack: 1
    image_obs: false
    discrete: false
    env_version: v4               # use -v4 environments
    envs:
      - Ant-v4
      - HalfCheetah-v4
      - Hopper-v4
      - Humanoid-v4
      - Walker2d-v4
