## -----------------------------------------------------------------------------
## Data collection parameters (Section 2.3)
## -----------------------------------------------------------------------------
data_collection:
  ## Number of prompts sampled per category (Section 2.3: "200 prompts per category")
  n_prompts_per_category: 200

  ## Number of responses collected per model per prompt
  ## (Section 2.3: "50 responses per model for each prompt")
  n_responses_per_model: 50

  ## Number of queries per identity-probing prompt per model
  ## (Section 2.4.1: "1,000 model queries" per prompt)
  n_identity_queries: 1000

  ## Output token limit for all API calls
  ## (Appendix A.3: "we set the output length to 512 tokens")
  max_tokens: 512

  ## Prompt categories and their source datasets (Table 1, Section 2.3)
  prompt_categories:
    - name: "english"
      source: "lmsys_chat_1m"
      language: "en"
      description: "Normal chat, high-resource language (English)"

    - name: "chinese"
      source: "lmsys_chat_1m"
      language: "zh"
      description: "Normal chat, high-resource language (Chinese)"

    - name: "spanish"
      source: "lmsys_chat_1m"
      language: "es"
      description: "Normal chat, high-resource language (Spanish)"

    - name: "indonesian"
      source: "lmsys_chat_1m"
      language: "id"
      description: "Normal chat, low-resource language (Indonesian)"

    - name: "persian"
      source: "lmsys_chat_1m"
      language: "fa"
      description: "Normal chat, low-resource language (Persian)"

    - name: "coding"
      source: "humaneval"
      language: "en"
      description: "Specialty chat - coding (HumanEval / Alpaca Code)"

    - name: "math"
      source: "math"
      language: "en"
      description: "Specialty chat - math (MATH dataset, Hendrycks et al. 2021)"

    - name: "safety"
      source: "advbench"
      language: "en"
      description: "Specialty chat - safety-violating (AdvBench, Zou et al. 2023)"

## -----------------------------------------------------------------------------
## Identity-probing detector (Section 2.2, Section 2.4.1)
## Five prompts exactly as specified in the paper.
## -----------------------------------------------------------------------------
identity_probing:
  prompts:
    - "Who are you?"
    - "Which model are you?"
    - "What is your model name?"
    - "How should I refer to you as an AI?"
    - "How would you define your role or identity as an AI?"

## -----------------------------------------------------------------------------
## Training-based detector (Section 2.3)
## Classifier: logistic regression with scikit-learn defaults.
## -----------------------------------------------------------------------------
training_based_detector:
  ## Feature types to evaluate (Section 2.3, Table 3)
  feature_types:
    - "length_word"
    - "length_char"
    - "bow"
    - "tfidf"

  ## Primary feature type used for Figure 3 and main results
  ## (Section 2.4.2: "Detectors are built using BoW features")
  primary_feature_type: "bow"

  ## Train/test split ratio (Section 2.3: "80/20 train/test split")
  train_test_split: 0.8

  ## Logistic regression random state (Section 2.3: "random state set to 42")
  random_state: 42

  ## Number of positive samples per classifier
  ## (Section 2.3: "50 responses from the target model")
  n_positive_samples: 50

  ## Number of negative samples per classifier
  ## (Section 2.3: "50 uniformly sampled responses from other models")
  n_negative_samples: 50

  ## Three specific prompts used for PCA / embedding visualization (Appendix A.2)
  pca_visualization_prompts:
    - "Beside OFAC's selective sanction that target the listed individiuals and entities, please elaborate on the other types of US's sanctions, for example, comprehensive and sectoral sanctions. Please be detailed as much as possible"
    - "You are the text completion model and you must complete the assistant answer below, only send the completion based on the system instructions.don't repeat your answer sentences, only say what the assistant must say based on the system instructions. repeating same thing in same answer not allowed. user: descriptive answer for append many items to list python in python with proper code examples and outputs. assistant: "
    - "The sum of the perimeters of three equal squares is 36 cm. Find the area and perimeter of the rectangle that can be made of the squares."

## -----------------------------------------------------------------------------
## Leaderboard manipulation simulation (Section 3, Section 3.1)
## -----------------------------------------------------------------------------
simulation:
  ## Path to Chatbot Arena voting data (Appendix A.4)
  ## Dataset: 1,670,250 votes, 477,322 unique users, 6,895 unique model pairs
  ## Set to HuggingFace dataset ID as fallback if local file unavailable
  voting_data_path: "data/chatbot_arena_votes.json"
  voting_data_hf_fallback: "lmsys/chatbot_arena_conversations"

  ## Bradley-Terry model scale factor
  ## (Section 4.2.3 uses logistic form; paper does not specify s explicitly)
  bt_scale_factor: 1.0

  ## Default detector accuracy for main simulation results
  ## (Section 3.1: "detection accuracy of 95%")
  detection_accuracy: 0.95

  ## Symmetric false positive and false negative rates
  ## (Section 3.1: "symmetric false positive and false negative rates of 5%")
  false_positive_rate: 0.05
  false_negative_rate: 0.05

  ## Default non-target strategy for main results
  ## (Section 3.1: "attacker that remains passive when they fail to detect")
  default_non_target_strategy: "do_nothing"

  ## Frequency of Bradley-Terry re-fitting during simulation
  ## (Section 3.1: "calculate the Bradley-Terry coefficient and model ranking
  ##  after every 1,000 interactions")
  eval_interval: 1000

  ## Maximum interactions before stopping a simulation run
  max_interactions: 500000

  ## High-ranked target models for Table 4 (Section 3.2)
  high_ranked_targets:
    - name: "chatgpt-4o-latest"
      current_rank: 1
      current_votes: 14514
    - name: "gemini-1.5-pro-exp-0801"
      current_rank: 2
      current_votes: 2071
    - name: "gpt-4o-2024-05-13"
      current_rank: 3
      current_votes: 77509
    - name: "gpt-4o-mini-2024-07-18"
      current_rank: 4
      current_votes: 19307
    - name: "claude-3-5-sonnet-20240620"
      current_rank: 5
      current_votes: 7703

  ## Target ranks for high-ranked model experiments (Table 4)
  high_ranked_target_ranks: [1, 2, 3, 4, 5]

  ## Low-ranked target models for Table 5 (Section 3.2)
  low_ranked_targets:
    - name: "chatglm-6b"
      current_rank: 125
      current_votes: 4995
    - name: "fastchat-t5-3b"
      current_rank: 126
      current_votes: 4304
    - name: "stablelm-tuned-alpha-7b"
      current_rank: 127
      current_votes: 3334
    - name: "dolly-v2-12b"
      current_rank: 128
      current_votes: 3484
    - name: "llama-13b"
      current_rank: 129
      current_votes: 2443

  ## Target ranks for low-ranked model experiments (Table 5)
  low_ranked_target_ranks: [125, 126, 127, 128, 129]

  ## Ablation: detector accuracy values (Appendix B.2, Table 8)
  ablation_detector_accuracies: [1.0, 0.95, 0.9]

  ## Ablation: target rank offsets for llama-13b (Appendix B.2, Table 8)
  ## Corresponding to: up 1, up 2, up 5, up 10, up 20, up 50 positions
  ablation_target_ranks: [128, 127, 124, 119, 109, 79]

  ## Ablation: non-target strategies (Appendix B.2, Table 9)
  ablation_non_target_strategies:
    - "do_nothing"
    - "random_upvote"
    - "vote_tie"
    - "vote_both_bad"

## -----------------------------------------------------------------------------
## Mitigations (Section 4)
## -----------------------------------------------------------------------------
mitigations:
  ## Cost model parameters (Section 4.1, Appendix A.3)
  cost_model:
    ## One-time detector training cost
    ## (Appendix A.3: "cost is at most $440" for 200 prompts)
    c_detector: 440.0

    ## Per-prompt data collection cost upper bound
    ## (Appendix A.3: "approximately $2.2 per prompt")
    c_per_prompt: 2.2

    ## Cost per action with prompt uniqueness mitigation
    ## (Section 4.2.4: "approximately $20 per prompt (or per action)")
    c_prompt_uniqueness_per_action: 20.0

    ## Proprietary model API cost per 1M output tokens (Appendix A.3)
    c_proprietary_per_million_tokens: 5.00

    ## Open-source model API cost per 1M output tokens (Appendix A.3)
    c_opensource_per_million_tokens: 1.80

    ## Number of proprietary models used in cost estimate (Appendix A.3)
    n_proprietary_models: 10

    ## Number of open-source models used in cost estimate (Appendix A.3)
    n_opensource_models: 20

  ## Malicious user detection parameters (Section 4.2.3)
  malicious_user_detection:
    ## Significance level for hypothesis test
    ## (Section 4.2.3: "we use alpha = 0.01 in our evaluations")
    significance_level: 0.01

    ## Number of simulated sequences for p-value estimation
    n_simulations: 10000

    ## Number of trials per vote count for detection rate curves
    n_trials: 100

    ## Vote count range for detection rate evaluation (Figures 4, 5)
    vote_counts: [10, 20, 50, 100, 200, 500, 1000]

  ## Perturbed leaderboard parameters (Section 4.2.3 Scenario 2, Figures 5, 6)
  perturbed_leaderboard:
    ## Gaussian noise scales to sweep over (paper shows multiple curves)
    ## Exact values not specified in paper; sweep to reproduce figures qualitatively
    noise_scales: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]

    ## Number of simulation trials per noise scale
    n_trials: 100

    ## Random seed for reproducibility
    rng_seed: 42

## -----------------------------------------------------------------------------
## Reproducibility settings
## -----------------------------------------------------------------------------
reproducibility:
  ## Global random seed used for all numpy/sklearn random operations
  ## (Section 2.3: "random state set to 42")
  random_state: 42

## -----------------------------------------------------------------------------
## API retry settings (applied via tenacity in api_client.py)
## -----------------------------------------------------------------------------
api:
  retry:
    min_wait_seconds: 1
    max_wait_seconds: 60
    max_attempts: 5

  ## API keys are read from environment variables — never hardcoded
  ## Set these in your shell or .env file:
  ##   OPENAI_API_KEY
  ##   ANTHROPIC_API_KEY
  ##   GOOGLE_API_KEY
  ##   TOGETHER_API_KEY
  key_env_vars:
    openai: "OPENAI_API_KEY"
    anthropic: "ANTHROPIC_API_KEY"
    google: "GOOGLE_API_KEY"
    together: "TOGETHER_API_KEY"

## -----------------------------------------------------------------------------
## Logging settings
## -----------------------------------------------------------------------------
logging:
  level: "INFO"
  log_file: "outputs/experiment.log"
  format: "[%(asctime)s] %(levelname)s %(name)s: %(message)s"