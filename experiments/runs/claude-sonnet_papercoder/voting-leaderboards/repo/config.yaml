## config.yaml

## =============================================================================
## Configuration for reproducing:
## "Exploring and Mitigating Adversarial Manipulation of Voting-Based Leaderboards"
## =============================================================================

## -----------------------------------------------------------------------------
## Output and cache directories
## -----------------------------------------------------------------------------
output_dir: "outputs"
cache_dir: "cache"

